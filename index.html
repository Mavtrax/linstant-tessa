<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO primaire -->
    <title>L'instant Tessa — Prothésiste ongulaire à Aix-en-Provence</title>
    <meta name="description" content="L'instant Tessa, prothésiste ongulaire à Aix-en-Provence. Pose d'ongles en gel, capsules, nail art et manucure. Prenez rendez-vous par email ou WhatsApp." />
    <meta name="keywords" content="prothésiste ongulaire, ongles gel, nail art, capsules, manucure, Aix-en-Provence, Bouches-du-Rhône" />
    <link rel="canonical" href="https://www.linstant-tessa.fr/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.linstant-tessa.fr/" />
    <meta property="og:title"       content="L'instant Tessa — Prothésiste ongulaire à Aix-en-Provence" />
    <meta property="og:description" content="Pose d'ongles en gel, capsules et nail art à Aix-en-Provence. Prenez rendez-vous avec Tessa." />
    <meta property="og:image"       content="https://www.linstant-tessa.fr/og-image.jpg" />
    <meta property="og:locale"      content="fr_FR" />
    <meta property="og:site_name"   content="L'instant Tessa" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="L'instant Tessa — Prothésiste ongulaire à Aix-en-Provence" />
    <meta name="twitter:description" content="Pose d'ongles en gel, capsules et nail art à Aix-en-Provence." />
    <meta name="twitter:image"       content="https://www.linstant-tessa.fr/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance : preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- JSON-LD LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BeautySalon",
      "name": "L'instant Tessa",
      "description": "Prothésiste ongulaire à Aix-en-Provence. Pose d'ongles en gel, capsules, nail art.",
      "url": "https://www.linstant-tessa.fr",
      "telephone": "+33605572104",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Aix-en-Provence",
        "postalCode": "13000",
        "addressCountry": "FR"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "19:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "09:00", "closes": "17:00" }
      ],
      "sameAs": ["https://instagram.com/linstant_tessa"]
    }
    </script>

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="L'instant Tessa" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
